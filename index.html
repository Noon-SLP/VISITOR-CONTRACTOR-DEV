<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noon SLP - Access System</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root{
      --bg-dark:#0b0e14;
      --card-bg:#12151c;
      --border-color:#242b3b;
      --noon-yellow:#ffc700;
      --text-main:#f0f2f5;
      --text-muted:#8b95a5;
      --input-bg:#090b10;
      --success:#10b981;
      --danger:#ef4444;
      --sidebar-bg:#12161f;
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{background-color:var(--bg-dark);color:var(--text-main);min-height:100vh;overflow-x:hidden}
    .hidden{display:none!important}
    .login-container{max-width:440px;margin:60px auto;background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
    .logo-box{width:150px;height:150px;margin:0 auto 18px;border-radius:14px;background:url('logo.jpeg') center/contain no-repeat #111}
    .role-tabs{display:flex;gap:8px;border:1px solid var(--border-color);border-radius:8px;overflow:hidden;margin-bottom:20px}
    .role-tab{flex:1;text-align:center;padding:12px 10px;background:#0d1117;color:var(--text-muted);font-weight:700;font-size:11px;cursor:pointer;text-transform:uppercase}
    .role-tab.active{background:var(--noon-yellow);color:#000}
    .input-group{margin-bottom:16px}
    .input-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px}
    .input-field{width:100%;padding:13px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--input-bg);color:var(--text-main);outline:none}
    .input-field:focus{border-color:var(--noon-yellow)}
    .btn-primary{width:100%;padding:14px 18px;border:none;border-radius:8px;background:var(--noon-yellow);color:#000;font-weight:700;cursor:pointer}
    .btn-outline{padding:10px 16px;border:1px solid var(--noon-yellow);border-radius:8px;background:transparent;color:var(--noon-yellow);font-weight:700;cursor:pointer}
    .btn-danger{padding:10px 16px;border:none;border-radius:8px;background:var(--danger);color:#fff;font-weight:700;cursor:pointer}
    .btn-success{padding:10px 16px;border:none;border-radius:8px;background:var(--success);color:#fff;font-weight:700;cursor:pointer}

    #app-layout{display:flex;min-height:100vh}
    .dashboard{width:100%;padding:22px}
    .header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--border-color)}
    .header h2{color:var(--noon-yellow);font-size:26px}
    .ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .ops-card{background:var(--card-bg);border:1px solid var(--border-color);padding:20px;border-radius:12px}
    .pass-item{background:var(--input-bg);border:1px solid var(--border-color);padding:12px;border-radius:8px;margin-bottom:12px}
    .pass-header{display:flex;justify-content:space-between;gap:12px}
    .qr-box{display:inline-block;padding:10px;background:#fff;border-radius:8px;margin-top:10px}
    #reader{width:100%;min-height:280px;background:#000;border:1px solid var(--border-color);border-radius:12px}
    .scan-result-card{border-radius:12px;padding:18px;margin-top:18px;border:1px solid var(--border-color);background:var(--card-bg)}
    .bg-green{background:var(--success);color:#fff}
    .bg-red{background:var(--danger);color:#fff}
    .bg-blue{background:#2563eb;color:#fff}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px 10px;border-bottom:1px solid var(--border-color);text-align:left}
    th{color:var(--text-muted);font-size:12px;text-transform:uppercase}
    @media (max-width:800px){.ops-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="login-view">
    <div class="login-container">
      <div class="logo-box"></div>

      <div class="role-tabs">
        <div class="role-tab active" data-role="guard">Guard</div>
        <div class="role-tab" data-role="ops">Ops</div>
        <div class="role-tab" data-role="admin">Admin</div>
      </div>

      <div id="login-guard">
        <div class="input-group">
          <label>Full Name</label>
          <input id="lg-name" class="input-field" type="text" placeholder="Your Full Name">
        </div>
        <div class="input-group">
          <label>Location</label>
          <select id="lg-location" class="input-field">
            <option value="">Select Guard Location</option>
            <option value="RUH01">RUH01</option>
            <option value="RUH02">RUH02</option>
            <option value="JED01">JED01</option>
          </select>
        </div>
        <div class="input-group">
          <label>Guard ID</label>
          <input id="lg-id" class="input-field" type="text" placeholder="Guard ID">
        </div>
        <button class="btn-primary" onclick="login('guard')">Login to Gate</button>
      </div>

      <div id="login-ops" class="hidden">
        <div class="input-group">
          <label>Full Name</label>
          <input id="lo-name" class="input-field" type="text" placeholder="Your Name">
        </div>
        <div class="input-group">
          <label>Email</label>
          <input id="lo-mail" class="input-field" type="email" placeholder="your@email.com">
        </div>
        <button class="btn-primary" onclick="login('ops')">Login to Portal</button>
      </div>

      <div id="login-admin" class="hidden">
        <div class="input-group">
          <label>Admin Name</label>
          <input id="la-name" class="input-field" type="text" placeholder="Admin Name">
        </div>
        <div class="input-group">
          <label>Admin Email</label>
          <input id="la-mail" class="input-field" type="email" placeholder="admin@email.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input id="la-pass" class="input-field" type="password" placeholder="Admin Password">
        </div>
        <button class="btn-primary" onclick="login('admin')">Login as Admin</button>
      </div>
    </div>
  </div>

  <div id="app-layout" class="hidden">
    <div id="dashboard-guard" class="dashboard">
      <div class="header">
        <h2>Gate Scanner</h2>
        <button class="btn-outline" onclick="logout()">Logout</button>
      </div>

      <div class="ops-grid">
        <div class="ops-card">
          <div id="reader"></div>
          <button class="btn-primary" style="margin-top:12px;" onclick="startScanner()">Start Scanner</button>
        </div>
        <div class="ops-card">
          <div id="scan-result" class="scan-result-card hidden"></div>
        </div>
      </div>
    </div>

    <div id="dashboard-ops" class="dashboard hidden">
      <div class="header">
        <h2>Visitor & Contractor Portal</h2>
        <button class="btn-outline" onclick="logout()">Logout</button>
      </div>

      <div class="ops-grid">
        <div class="ops-card">
          <h3>Submit New Request</h3>

          <div class="input-group">
            <label>Type</label>
            <select id="req-type" class="input-field">
              <option value="Visitor">Visitor</option>
              <option value="Contractor">Contractor</option>
            </select>
          </div>

          <div class="input-group">
            <label>Host Name</label>
            <input id="req-host-name" class="input-field" type="text">
          </div>

          <div class="input-group">
            <label>Host Email</label>
            <input id="req-host-email" class="input-field" type="email">
          </div>

          <div class="input-group">
            <label>Visitor Name</label>
            <input id="req-visitor-name" class="input-field" type="text">
          </div>

          <div class="input-group">
            <label>Location</label>
            <select id="req-location" class="input-field">
              <option value="RUH01">RUH01</option>
              <option value="RUH02">RUH02</option>
              <option value="JED01">JED01</option>
            </select>
          </div>

          <div class="input-group">
            <label>Start Date</label>
            <input id="req-start-date" class="input-field" type="date">
          </div>

          <div class="input-group">
            <label>End Date</label>
            <input id="req-end-date" class="input-field" type="date">
          </div>

          <button class="btn-primary" onclick="submitRequest()">Submit for Approval</button>
        </div>

        <div class="ops-card">
          <h3>My Passes</h3>
          <div id="my-passes-list">Loading...</div>
        </div>
      </div>
    </div>

    <div id="dashboard-admin" class="dashboard hidden">
      <div class="header">
        <h2>Admin Dashboard</h2>
        <button class="btn-outline" onclick="logout()">Logout</button>
      </div>

      <div class="ops-card">
        <div id="admin-data-table">Loading approvals...</div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxINw_mj3132rcSP8RwNDusXvB3vdSr8P2KY_FCGqEN6f7nXTItc3CLJZsw9DYxInX1qg/exec';

    let currentUser = null;
    let html5QrCode = null;
    let isProcessingScan = false;

    // Keep URL flow compatible with your original project
    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('role');

    function setRoleTab(role) {
      document.querySelectorAll('.role-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.role === role);
      });

      document.getElementById('login-guard').classList.toggle('hidden', role !== 'guard');
      document.getElementById('login-ops').classList.toggle('hidden', role !== 'ops');
      document.getElementById('login-admin').classList.toggle('hidden', role !== 'admin');
    }

    if (roleParam === 'staff') {
      setRoleTab('guard');
    }

    document.querySelectorAll('.role-tab').forEach(tab => {
      tab.addEventListener('click', function () {
        setRoleTab(this.dataset.role);
      });
    });

    function login(role) {
      if (role === 'guard') {
        const fullName = document.getElementById('lg-name').value.trim();
        const guardId = document.getElementById('lg-id').value.trim();
        const location = document.getElementById('lg-location').value.trim();

        if (!fullName || !guardId || !location) {
          alert('Please fill all guard details.');
          return;
        }

        currentUser = { role: 'guard', name: fullName, guardId: guardId, location: location };
      } else if (role === 'ops') {
        const fullName = document.getElementById('lo-name').value.trim();
        const email = document.getElementById('lo-mail').value.trim();

        if (!fullName || !email) {
          alert('Please enter your name and email.');
          return;
        }

        currentUser = { role: 'ops', name: fullName, email: email.toLowerCase() };
      } else if (role === 'admin') {
        const name = document.getElementById('la-name').value.trim();
        const email = document.getElementById('la-mail').value.trim();
        const pass = document.getElementById('la-pass').value;

        if (!name || !email || !pass) {
          alert('Please fill all admin details.');
          return;
        }

        if (pass === 'NoonCCTVSLP#2026') {
          currentUser = { role: 'admin', name: name, email: email.toLowerCase() };
        } else {
          alert('Incorrect Password');
          return;
        }
      }

      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-layout').classList.remove('hidden');

      document.getElementById('dashboard-guard').classList.add('hidden');
      document.getElementById('dashboard-ops').classList.add('hidden');
      document.getElementById('dashboard-admin').classList.add('hidden');

      if (currentUser.role === 'guard') {
        document.getElementById('dashboard-guard').classList.remove('hidden');
        initGuardScreen();
      } else if (currentUser.role === 'ops') {
        document.getElementById('dashboard-ops').classList.remove('hidden');
        loadMyPasses();
      } else if (currentUser.role === 'admin') {
        document.getElementById('dashboard-admin').classList.remove('hidden');
        loadAdminData();
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('app-layout').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      setRoleTab('guard');
    }

    function initGuardScreen() {
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch (e) {}
      }

      html5QrCode = new Html5Qrcode('reader');
      startScanner();
    }

    function startScanner() {
      if (!html5QrCode) return;

      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async (decodedText) => {
          if (isProcessingScan) return;
          isProcessingScan = true;

          const id = decodedText.trim().toUpperCase();
          const resultBox = document.getElementById('scan-result');
          resultBox.className = 'scan-result-card bg-blue';
          resultBox.innerHTML = '<strong>Checking pass...</strong><div>Scanning: ' + id + '</div>';

          try {
            const res = await fetch(SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'get_single', id: id }),
              redirect: 'follow'
            });

            const data = await res.json();

            if (data && !data.error) {
              const pass = data;
              const status = String(pass.Status || 'Pending').toUpperCase();

              resultBox.className = 'scan-result-card bg-green';
              resultBox.innerHTML = `
                <h3>Pass Valid</h3>
                <p><strong>Name:</strong> ${pass.VisitorName || '-'}</p>
                <p><strong>ID:</strong> ${pass.UniqueID || '-'}</p>
                <p><strong>Type:</strong> ${pass.Type || '-'}</p>
                <p><strong>Location:</strong> ${pass.Location || '-'}</p>
                <p><strong>Status:</strong> ${status}</p>
              `;

              const confirmBtn = document.createElement('button');
              confirmBtn.className = 'btn-primary';
              confirmBtn.style.marginTop = '12px';
              confirmBtn.textContent = 'Confirm Check-In';
              confirmBtn.onclick = async function () {
                await fetch(SCRIPT_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({
                    action: 'check_in',
                    id: pass.UniqueID,
                    guardInfo: currentUser.name + ' (' + currentUser.location + ')',
                    headCount: 1
                  }),
                  redirect: 'follow'
                });

                resultBox.className = 'scan-result-card bg-green';
                resultBox.innerHTML = '<h3>Check-In Recorded</h3>';
              };

              resultBox.appendChild(confirmBtn);
            } else {
              resultBox.className = 'scan-result-card bg-red';
              resultBox.innerHTML = '<h3>Invalid or missing pass</h3><p>' + (data && data.error ? data.error : 'No record found.') + '</p>';
            }
          } catch (err) {
            resultBox.className = 'scan-result-card bg-red';
            resultBox.innerHTML = '<h3>Scan failed</h3><p>' + err.toString() + '</p>';
          } finally {
            isProcessingScan = false;
          }
        },
        () => {}
      ).catch(err => {
        console.error(err);
      });
    }

    async function submitRequest() {
      const type = document.getElementById('req-type').value;
      const hostName = document.getElementById('req-host-name').value.trim();
      const hostEmail = document.getElementById('req-host-email').value.trim();
      const visitorName = document.getElementById('req-visitor-name').value.trim();
      const location = document.getElementById('req-location').value;
      const startDate = document.getElementById('req-start-date').value;
      const endDate = document.getElementById('req-end-date').value;

      if (!hostName || !hostEmail || !visitorName || !startDate || !endDate) {
        alert('Please fill all required fields.');
        return;
      }

      const payload = {
        action: 'create',
        type: type,
        hostName: hostName,
        hostEmail: hostEmail,
        visitorName: visitorName,
        location: location,
        startDate: startDate,
        endDate: endDate
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: 'follow'
        });

        const out = await res.json();
        if (out && out.status === 'success') {
          alert('Request submitted successfully.');
          loadMyPasses();
        } else {
          alert('Submission failed: ' + (out && out.message ? out.message : 'Unknown error'));
        }
      } catch (err) {
        alert('Error: ' + err.toString());
      }
    }

    async function loadMyPasses() {
      if (!currentUser || currentUser.role !== 'ops') return;

      const list = document.getElementById('my-passes-list');
      list.innerHTML = 'Fetching your passes...';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'get_by_email', email: currentUser.email }),
          redirect: 'follow'
        });

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          list.innerHTML = '<p>No passes found.</p>';
          return;
        }

        list.innerHTML = data.map(pass => `
          <div class="pass-item">
            <div class="pass-header">
              <div>
                <strong>${pass.VisitorName || '-'}</strong><br>
                <small>${pass.Type || '-'} • ${pass.Location || '-'}</small><br>
                <small>${pass.StartDate || '-'} to ${pass.EndDate || pass.StartDate || '-'}</small>
              </div>
              <div>
                <small>${pass.Status || 'Pending'}</small><br>
                <small>${pass.UniqueID || '-'}</small>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = '<p>Error loading passes.</p>';
      }
    }

    async function loadAdminData() {
      const table = document.getElementById('admin-data-table');
      table.innerHTML = 'Loading approvals...';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'get_all' }),
          redirect: 'follow'
        });

        const data = await res.json();

        if (!data || !Array.isArray(data.passes)) {
          table.innerHTML = '<p>No data available.</p>';
          return;
        }

        const rows = data.passes.map(pass => `
          <tr>
            <td>${pass.UniqueID || '-'}</td>
            <td>${pass.VisitorName || '-'}</td>
            <td>${pass.Type || '-'}</td>
            <td>${pass.Location || '-'}</td>
            <td>${pass.Status || 'Pending'}</td>
            <td>
              <button class="btn-success" onclick="approvePass('${pass.UniqueID || ''}')">Approve</button>
              <button class="btn-danger" onclick="rejectPass('${pass.UniqueID || ''}')">Reject</button>
            </td>
          </tr>
        `).join('');

        table.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Location</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } catch (err) {
        table.innerHTML = '<p>Failed to load admin data.</p>';
      }
    }

    async function approvePass(id) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'update_status', id: id, newStatus: 'Approved' }),
          redirect: 'follow'
        });

        const out = await res.json();
        if (out && out.status === 'success') {
          alert('Pass approved.');
          loadAdminData();
        }
      } catch (err) {
        alert('Approval failed.');
      }
    }

    async function rejectPass(id) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'update_status', id: id, newStatus: 'Rejected' }),
          redirect: 'follow'
        });

        const out = await res.json();
        if (out && out.status === 'success') {
          alert('Pass rejected.');
          loadAdminData();
        }
      } catch (err) {
        alert('Reject failed.');
      }
    }
  </script>
</body>
</html>
