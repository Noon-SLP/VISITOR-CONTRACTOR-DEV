// Convert old Drive URLs to raw image thumbnail URLs dynamically
function convertDriveUrls(dataObj) {
    let str = JSON.stringify(dataObj);
    str = str.replace(/https:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)\/view[^\s"'\\]*/g, "https://drive.google.com/thumbnail?id=$1&sz=w1000");
    str = str.replace(/https:\/\/drive\.google\.com\/uc\?[^\s"'\\]*id=([a-zA-Z0-9_-]+)[^\s"'\\]*/g, "https://drive.google.com/thumbnail?id=$1&sz=w1000");
    return JSON.parse(str);
}

async function confirmPinCreate(){let pin=document.getElementById('new-pin-input').value.trim();if(pin.length!==4)return alert("Please enter a valid 4-digit PIN.");userSecurityPin=pin;let email=currentUser.email;if(currentUser.role==='admin'){const ei=document.getElementById('req-admin-email');if(ei&&ei.value)email=ei.value.toLowerCase().trim();}localStorage.setItem('user_pin_'+email,pin);document.getElementById('pin-create-modal').classList.add('hidden');if(pinCreateMode==='reset'){try{await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'update_pin',email:email,pin:pin})});}catch(e){}setTimeout(()=>loadMyPasses(true,true),1000);renderMyPasses(lockedPassesData);}else{submitRequest();}}

function processAndRenderPasses(data,email,isSilent){if(currentUser&&currentUser.role==='admin'){renderMyPasses(data);return;}let hasActive=false;const todayNum=new Date().setHours(0,0,0,0);if(Array.isArray(data)){data.forEach(p=>{let safeType=String(p.Type||'');let safeStatus=String(p.Status||'Pending');let endObj=parseFlexibleDate(p.EndDate)||parseFlexibleDate(p.StartDate);let endNum=endObj?endObj.setHours(0,0,0,0):todayNum;let isComp=(todayNum>endNum)||safeStatus==='Rejected'||safeStatus==='Completed';if(!isComp)hasActive=true;});}let backendPin=null;if(Array.isArray(data)){for(let i=data.length-1;i>=0;i--){if(data[i].HostName&&data[i].HostName.includes('||PIN:')){backendPin=data[i].HostName.split('||PIN:')[1];break;}}}let localPin=localStorage.getItem('user_pin_'+email);if(!hasActive&&data.length>0){localStorage.removeItem('user_pin_'+email);userSecurityPin=null;if(backendPin){fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'reset_pin',email:email})}).catch(e=>{});}renderMyPasses(data);return;}if(!hasActive&&data.length===0){renderMyPasses(data);return;}if(!backendPin&&localPin){backendPin=localPin;fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'update_pin',email:email,pin:localPin})}).catch(e=>{});}if(backendPin&&backendPin!==localPin){lockedPassesData=data;const verifyModal=document.getElementById('pin-verify-modal');if(!isSilent&&verifyModal){verifyModal.classList.remove('hidden');document.getElementById('pin-error-msg').classList.add('hidden');document.getElementById('verify-pin-input').value='';}const listDiv=document.getElementById('my-passes-list');if(listDiv)listDiv.innerHTML='<p style="color:var(--text-muted);font-size:13px;margin-top:20px;text-align:center;">Passes locked. <button class="btn-primary btn-sm" style="width:auto;padding:4px 10px;margin-left:10px;" onclick="loadMyPasses(true,false)">UNLOCK</button></p>';return;}if(!backendPin&&!localPin&&Array.isArray(data)&&data.length>0){lockedPassesData=data;const createModal=document.getElementById('pin-create-modal');if(!isSilent&&createModal){pinCreateMode='reset';createModal.classList.remove('hidden');document.getElementById('new-pin-input').value='';}const listDiv=document.getElementById('my-passes-list');if(listDiv)listDiv.innerHTML='<p style="color:var(--text-muted);font-size:13px;margin-top:20px;text-align:center;">Passes locked. Awaiting new PIN.</p>';return;}userSecurityPin=backendPin||localPin;renderMyPasses(data);}

function toggleFullScreen(){const d=document,de=d.documentElement;const req=de.requestFullscreen||de.mozRequestFullScreen||de.webkitRequestFullScreen||de.msRequestFullscreen;const exit=d.exitFullscreen||d.mozCancelFullScreen||d.webkitExitFullscreen||d.msExitFullscreen;if(!d.fullscreenElement&&!d.mozFullScreenElement&&!d.webkitFullscreenElement&&!d.msFullscreenElement){if(req)req.call(de).catch(e=>console.log(e));else alert("Fullscreen not supported")}else{if(exit)exit.call(d).catch(e=>console.log(e))}}

function isDateInRange(s,ft,stStr,enStr){if(ft==='all')return true;const d=parseFlexibleDate(s);if(!d)return true;const now=new Date(),ts=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0,0),te=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999);if(ft==='today')return d>=ts&&d<=te;if(ft==='weekly'){const w=new Date(ts);w.setDate(w.getDate()-7);return d>=w&&d<=te}if(ft==='monthly'){const m=new Date(ts);m.setMonth(m.getMonth()-1);return d>=m&&d<=te}if(ft==='6months'){const m6=new Date(ts);m6.setMonth(m6.getMonth()-6);return d>=m6&&d<=te}if(ft==='year'){const y=new Date(ts);y.setFullYear(y.getFullYear()-1);return d>=y&&d<=te}if(ft==='custom'){if(!stStr||!enStr)return true;const st=parseFlexibleDate(stStr),en=parseFlexibleDate(enStr);if(st)st.setHours(0,0,0,0);if(en)en.setHours(23,59,59,999);if(st&&en)return d>=st&&d<=en}return true}

async function performManualSearch() {
    let q = document.getElementById('guard-search-input').value.toLowerCase().trim();
    let resDiv = document.getElementById('manual-search-results');
    if(!q) { resDiv.innerHTML = ''; return; }
    resDiv.innerHTML = '<p style="color:var(--text-muted); font-size:12px;">Searching...</p>';
    try {
        let data = globalAdminData;
        if(!data || data.length === 0) {
            const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'get_all' }) });
            data = convertDriveUrls(await res.json()); globalAdminData = data;
        }
        let matches = data.filter(r => {
            if(!r.UniqueID || r.Status === 'Rejected') return false;
            let fullStr = String(r.VisitorName + " " + r.UniqueID + " " + r.SlpTicketNo + " " + r.ContactNo + " " + r.HostEmail).toLowerCase();
            return fullStr.includes(q);
        }).slice(0, 5);

        if(matches.length === 0) {
            resDiv.innerHTML = '<p style="color:var(--danger); font-size:12px;">No passes found.</p>';
        } else {
            let h = ''; const todayNum = new Date().setHours(0,0,0,0);
            matches.forEach(m => {
                let dType = String(m.Type || ''); let dStatus = String(m.Status || 'Pending'); let dLoc = String(m.Location || '');
                let startObj = parseFlexibleDate(m.StartDate);
                let startNum = startObj ? startObj.setHours(0,0,0,0) : todayNum;
                let endObj = parseFlexibleDate(m.EndDate); let endNum = endObj ? endObj.setHours(0,0,0,0) : startNum;
                let displayStatus = dStatus; let sc = 'var(--noon-yellow)';
                
                if (currentUser && currentUser.role === 'admin' && !currentUser.location) { displayStatus = "NO FACILITY SELECTED"; sc = "var(--danger)"; }
                else if (dStatus === 'Pending') { displayStatus = "PENDING"; sc = "var(--noon-yellow)"; }
                else if (dStatus !== 'Approved') { displayStatus = "DENIED"; sc = "var(--danger)"; }
                else if (currentUser && dLoc !== currentUser.location) { displayStatus = "WRONG FACILITY"; sc = "var(--danger)"; }
                else if (todayNum < startNum || todayNum > endNum) { displayStatus = todayNum > endNum ? "EXPIRED" : "INVALID DATE"; sc = "var(--danger)"; }
                else { displayStatus = "APPROVED"; sc = "var(--success)"; }
                
                h += `<div style="background:var(--input-bg); border:1px solid var(--border-color); padding:10px; border-radius:6px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center;"><div><strong style="color:white;font-size:13px;">${m.VisitorName}</strong><br><span style="font-size:11px;color:var(--text-muted);">${m.UniqueID} | ${m.Type} | ${m.Location}</span><br><span style="font-size:10px;color:${sc};font-weight:bold;text-transform:uppercase;">${displayStatus}</span></div><button class="btn-primary btn-sm" style="width:auto; padding:6px 15px;" onclick="document.getElementById('manual-search-results').innerHTML=''; onScanSuccess('${m.UniqueID}')">OPEN</button></div>`;
            });
            resDiv.innerHTML = h;
        }
    } catch(e) { resDiv.innerHTML = '<p style="color:var(--danger); font-size:12px;">Search failed.</p>'; }
}

function downloadQR(id) {
    let safeId = String(id).replace(/[^a-zA-Z0-9_-]/g, '');
    const qrBox = document.getElementById('qr-' + safeId); if (!qrBox) return;
    let canvas = qrBox.querySelector('canvas'); let img = qrBox.querySelector('img');
    let sourceImage = canvas && canvas.style.display !== 'none' ? canvas : (img && img.src ? img : null);
    if (!sourceImage) return alert("QR Code not ready yet.");
    let size = 150; let padding = 20; let newCanvas = document.createElement('canvas');
    newCanvas.width = size + (padding * 2); newCanvas.height = size + (padding * 2);
    let ctx = newCanvas.getContext('2d'); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
    ctx.drawImage(sourceImage, padding, padding, size, size);
    const link = document.createElement('a'); link.href = newCanvas.toDataURL('image/png'); link.download = `Noon_Pass_QR_${safeId}.png`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

async function loadMyPasses(forceRefresh=false,isSilent=false){
    const listDiv=document.getElementById('my-passes-list');if(!listDiv)return;
    let targetEmail=currentUser.email;
    if(currentUser.role==='admin'){
        const ei=document.getElementById('req-admin-email'),inputEmail=ei?ei.value.toLowerCase().trim():'';
        if(inputEmail)targetEmail=inputEmail;
        else{if(!isSilent)listDiv.innerHTML=`<p style="color:var(--text-muted);font-size:13px;">${t("msg_enter_email")}</p>`;return}
    }
    const cachedKey='cached_passes_'+targetEmail,cached=localStorage.getItem(cachedKey);
    if(!forceRefresh&&cached&&!isSilent){
        try{ let parsed=JSON.parse(cached); if(Array.isArray(parsed)){ processAndRenderPasses(parsed, targetEmail, false); } else localStorage.removeItem(cachedKey); }catch(e){ localStorage.removeItem(cachedKey); }
    }
    else if(!isSilent||forceRefresh)listDiv.innerHTML=`<p style="color:var(--text-muted);font-size:13px;">${t("fetching")}</p>`;
    try{
        const res=await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'get_by_email', email: targetEmail }) });
        if(!res.ok)throw new Error("HTTP error");
        const data=convertDriveUrls(await res.json());
        if(Array.isArray(data)){ 
            const newDataStr = JSON.stringify(data);
            if (isSilent && cached === newDataStr) return; 
            localStorage.setItem(cachedKey, newDataStr); 
            processAndRenderPasses(data, targetEmail, isSilent); 
        }
    }catch(e){if(!isSilent&&!cached)listDiv.innerHTML='<p style="color:var(--danger);font-size:13px;">Error.</p>'}
}

function parseLogs(row) {
    let visits = [];
    let gLogs = String(row.GateLogs || "");

    if (!gLogs.trim() && row.CheckInTime) {
        visits.push({
            in: new Date(row.CheckInTime),
            out: row.CheckOutTime ? new Date(row.CheckOutTime) : null,
            guardIn: row.ScannedByGuard || 'Unknown',
            guardOut: row.ScannedByGuard || 'Unknown'
        });
        return visits;
    }

    if (gLogs.startsWith("[")) {
        try {
            let logs = JSON.parse(gLogs);
            let currentVisit = null;
            logs.forEach(l => {
                if (l.action === 'IN') {
                    currentVisit = { in: new Date(l.time), out: null, guardIn: l.guard || 'Unknown', guardOut: '' };
                    visits.push(currentVisit);
                } else if (l.action === 'OUT') {
                    if (currentVisit && !currentVisit.out) {
                        currentVisit.out = new Date(l.time);
                        currentVisit.guardOut = l.guard || 'Unknown';
                    } else {
                        visits.push({ in: null, out: new Date(l.time), guardIn: '', guardOut: l.guard || 'Unknown' });
                    }
                }
            });
        } catch(e) {}
    }
    return visits;
}

async function loadAdminData(isSilent=false){
    const cachedM=localStorage.getItem('cached_admin_data');
    if(cachedM && !isSilent){
        try{ 
            let parsedM = JSON.parse(cachedM); 
            if(Array.isArray(parsedM)) renderAdminData(parsedM.reverse()); 
            else { localStorage.removeItem('cached_admin_data'); }
        } catch(e){ localStorage.removeItem('cached_admin_data'); }
    }
    try{
        const resMain = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'get_all' }) });
        if(!resMain.ok) throw new Error("HTTP error");
        
        const dataMain = convertDriveUrls(await resMain.json());
        
        if(Array.isArray(dataMain)){ 
            const newMStr = JSON.stringify(dataMain);
            if (isSilent && cachedM === newMStr) return; 
            
            localStorage.setItem('cached_admin_data', newMStr); 
            renderAdminData(dataMain.reverse()); 
        } else { renderAdminData([]); }
    }catch(e){ renderAdminData(globalAdminData || []); if(!isSilent&&!cachedM)console.error(e); }
}

    if(Array.isArray(globalAdminData)){

        if(item) {
            item.Status = newStatus; localStorage.setItem('cached_admin_data', JSON.stringify(globalAdminData)); renderAdminData(globalAdminData);
            if(item.HostEmail) { localStorage.removeItem('cached_passes_' + String(item.HostEmail).toLowerCase().trim()); }

    try{
        const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'update_status',id:id,newStatus:newStatus})});

async function submitAdminGateAction(actionType) {
    const id = document.getElementById('admin-gate-id').value;
    if(!id) return;
    
    let item = globalAdminData.find(x => String(x.UniqueID) === String(id));
    if(item) {
        const isInside = !!item.CheckInTime && !item.CheckOutTime;
        const actor = item.ScannedByGuard || 'Unknown';
        
        if (actionType === 'check_in' && isInside) {
            return alert("This pass is already checked IN by:\n" + actor);
        }
        if (actionType === 'check_out' && !isInside) {
            return alert("This pass is already checked OUT by:\n" + actor);
        }
    }
    
    if(!confirm(`Proceed to ${actionType === 'check_in' ? 'Check In' : 'Check Out'} pass ${id}?`)) return;

        localStorage.removeItem('cached_admin_data'); 
        closeAdminGateModal();
        setTimeout(()=>{loadAdminData(true)},1000);
    }catch(e){
        alert("Action failed.");
    }finally{ 
        startAutoRefresh(currentUser.role); 
    }

function switchScanMode(mode) {
    const btnCam = document.getElementById('btn-mode-camera'); const btnGun = document.getElementById('btn-mode-gun');
    const gunContainer = document.getElementById('gun-scanner-container'); const camWrapper = document.getElementById('camera-mode-wrapper');
    const gunInput = document.getElementById('gun-scan-input');
    if (mode === 'gun') {
        if(btnCam) btnCam.className = "btn-primary btn-outline"; if(btnGun) btnGun.className = "btn-primary";
        if(camWrapper) camWrapper.classList.add('hidden'); if(gunContainer) gunContainer.classList.remove('hidden');
        stopScanner(); if(gunInput) { gunInput.focus(); gunInput.value = ""; }
    } else {
        if(btnCam) btnCam.className = "btn-primary"; if(btnGun) btnGun.className = "btn-primary btn-outline";
        if(gunContainer) gunContainer.classList.add('hidden'); if(camWrapper) camWrapper.classList.remove('hidden');
    }
}

function handleGunScan(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); const code = event.target.value.replace(/\s+/g, '').trim().toUpperCase();
        if (code) { event.target.value = ""; onScanSuccess(code); }
    }
}

function startScanner() {
    const btn = document.getElementById('btn-start-scan'); const readerCont = document.getElementById('reader-container'); const scanResult = document.getElementById('scan-result');
    if(btn) btn.classList.add('hidden'); if(scanResult) scanResult.classList.add('hidden'); if(readerCont) readerCont.classList.remove('hidden');
    if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
    startQrCodeStream();
}

function startQrCodeStream() {
    if (html5QrCode && html5QrCode.isScanning) { html5QrCode.stop().then(() => { playQrCodeStream(); }).catch(e => { playQrCodeStream(); }); } 
    else { playQrCodeStream(); }
}

function playQrCodeStream() {
    html5QrCode.start( { facingMode: scannerFacingMode }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, (errorMessage) => { } ).catch((err) => { alert("Camera access error. Please check permissions."); hideScannerUI(); });
}

function switchScannerCamera() { scannerFacingMode = scannerFacingMode === "environment" ? "user" : "environment"; startQrCodeStream(); }
function stopScanner() {
    if (html5QrCode && html5QrCode.isScanning) { html5QrCode.stop().then(() => { hideScannerUI(); }).catch(e => { hideScannerUI(); }); } 
    else { hideScannerUI(); }
}

function showScanResult(d,rHtml,cClass,isContractor=false){
    const sr=document.getElementById('scan-result');
    sr.className = '';
    document.getElementById('r-decision').innerText=d;
    document.getElementById('r-reason').innerHTML=rHtml;
    
    setTimeout(() => { sr.className=`scan-result-card ${cClass} ${isContractor?'fullscreen-scan':''}`; }, 10);
    if(cClass==="bg-red"){
        setTimeout(()=>{
            if (document.getElementById('r-decision').innerText === d) { sr.className = 'scan-result-card hidden'; isProcessingScan = false; try{if(html5QrCode)html5QrCode.resume();}catch(e){} }
        },3500);
    }

function filterTeamMembers(query) {
    let q = query.toLowerCase();
    let rows = document.querySelectorAll('.team-member-scan-row');
    rows.forEach(row => { if(row.innerText.toLowerCase().includes(q)) { row.style.display = 'flex'; } else { row.style.display = 'none'; } });

    deviceCards.forEach(card => { if(card.getAttribute('data-search').includes(q)) { card.style.display = 'block'; } else { card.style.display = 'none'; } });

async function confirmAction(){
    const btn=document.getElementById('btn-confirm-action'); let hcVal=1;
    const teamSec = document.getElementById('guard-team-section');
    if(teamSec && !teamSec.classList.contains('hidden')) {
        const chks = document.querySelectorAll('.att-chk');
        if(chks.length > 0) {
            hcVal = document.querySelectorAll('.att-chk:checked').length;
            if(hcVal === 0) return alert("Please select at least one person.");
        } else {
            const hcInput = document.getElementById('guard-headcount');
            if(hcInput && !hcInput.parentElement.classList.contains('hidden')){ hcVal = hcInput.value; if(!hcVal||hcVal<1) return alert("Please enter the number of workers present."); }
        }
    }
    
    btn.innerText="SAVING & REFRESHING..."; btn.disabled=true;
    const gInfo = `${currentUser.name} (${currentUser.location})`;
    const payload = JSON.stringify({ action: currentScanAction, id: currentScannedID, guardInfo: gInfo, headCount: hcVal });
    
    try {
        const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload });
        if(res.ok) { window.location.reload(); } else {
            alert("Sync failed. Please try again."); btn.innerText = t("confirm_action"); btn.disabled = false; isProcessingScan = false;
        }
    } catch(e) {
        alert("Network error. Please try again."); btn.innerText = t("confirm_action"); btn.disabled = false; isProcessingScan = false;
    }
}

    if(capturedImages.add_team_iqama)iB64=capturedImages.add_team_iqama.split(',')[1];
    else if(ii&&ii.files.length>0){let f=await getBase64(ii.files[0]);iB64=f.split(',')[1]} else return alert("Provide Iqama photo.");

    if(capturedImages.add_team_selfie)sB64=capturedImages.add_team_selfie.split(',')[1];
    else if(si&&si.files.length>0){let f=await getBase64(si.files[0]);sB64=f.split(',')[1]} else return alert("Provide Selfie photo.");

    addMoreTeamList.push({ iqama:"data:image/jpeg;base64,"+iB64, selfie:"data:image/jpeg;base64,"+sB64, rawIqama:iB64, rawSelfie:sB64, rawDevicePhoto:tDevB64, name: tName.value.trim() + " *NEW_MEMBER*", iqamaText: tIqama.value.trim(), deviceType: devType, deviceId: devId.trim() });
    renderAddTeamRoster();
    if(ii)ii.value="";if(si)si.value="";if(tName)tName.value="";if(tIqama)tIqama.value="";
    document.getElementById('req-add-team-device-type').value = "None"; document.getElementById('req-add-team-device-id').value = ""; 
    toggleAddTeamDeviceInput(); clearCapturedData('add_team_iqama');clearCapturedData('add_team_selfie');clearCapturedData('add_team_imeiphoto');
}

function renderAddTeamRoster(){
    const div=document.getElementById('add-team-roster-display');
    if(addMoreTeamList.length>0){
        div.classList.remove('hidden');let h='';
        addMoreTeamList.forEach((m,idx)=>{
            let cleanName = m.name.replace(/\*NEW_MEMBER\*/gi, '').trim();
            let devHtml = m.deviceType !== 'None' ? `<span style="background:var(--noon-yellow);color:#000;font-size:10px;padding:2px 5px;border-radius:4px;margin-left:5px;font-weight:bold;">${m.deviceType}</span>` : '';
            let imgsHtml = `<img src="${m.iqama}" class="team-member-img" onclick="openFullscreenImage(this.src)"><img src="${m.selfie}" class="team-member-img" onclick="openFullscreenImage(this.src)">`;
            h+=`<div class="team-member-row"><span style="color:white;font-size:13px;font-weight:bold;">${cleanName} <span style="background:var(--success);color:white;font-size:10px;padding:2px 5px;border-radius:4px;margin-left:5px;font-weight:bold;">${t('new_badge')}</span>${devHtml}</span><div style="display:flex;gap:10px;">${imgsHtml}<button type="button" style="background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:16px;" onclick="addMoreTeamList.splice(${idx},1);renderAddTeamRoster();">❌</button></div></div>`;
        });
        div.innerHTML=h;
    }else div.classList.add('hidden');
}

async function submitAddMorePeople() {
    if(addMoreTeamList.length === 0) return alert("Please add at least one person to the list first.");
    if(!confirm("WARNING: This will reset the pass status back to PENDING. Do you want to proceed?")) return;
    let btn = document.getElementById('btn-submit-add-more'); btn.innerText = "SUBMITTING..."; btn.disabled = true;
    let cleanTeam = [];
    addMoreTeamList.forEach(m => { let devStr = m.deviceType !== 'None' ? `${m.deviceType} (${m.deviceId})` : 'None'; cleanTeam.push({ iqama: m.rawIqama, selfie: m.rawSelfie, devicePhoto: m.rawDevicePhoto, name: m.name, iqamaText: m.iqamaText, deviceString: devStr }); });
    try {
        const payload = { action: 'add_team_members', id: addMorePassId, team: cleanTeam };
        const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        let json = await res.json();
        if (json.status === 'success') { closeAddMoreModal(); loadMyPasses(true, true); alert("People added successfully! The pass is now PENDING approval."); } 
        else throw new Error(json.message);
    } catch(e) { alert("Upload failed. Try again. Error: " + e.message); } 
    finally { btn.innerText = "SUBMIT & SEND FOR APPROVAL"; btn.disabled = false; }
}
</script>
